<!doctype html>
<!--
  Generator for the loader's 3D cloth (spec §23.19): a SmartFit tee on a
  hanger, spinning. NOT shipped in the app: tool/loader_cloth/render_frames.py
  renders ?frame=i&frames=N as still PNGs into assets/loader/, which the
  SFLoader plays inside its rounded ring (light, works on every platform).
  three.js r149 (MIT) is the copy bundled for Zayn (assets/mascot/).
-->
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}</style>
</head>
<body>
<script src="../../assets/mascot/three.min.js"></script>
<script>
(function () {
  "use strict";
  var p = new URLSearchParams(location.search);
  var frame = +(p.get("frame") || 0), frames = +(p.get("frames") || 24);
  THREE.ColorManagement.legacyMode = false;
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 50);
  camera.position.set(0, 0.18, 6.1); camera.lookAt(0, 0.18, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a948b, 0.95));
  var key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(3, 4, 5); scene.add(key);
  var rim = new THREE.DirectionalLight(0x9dffb0, 0.5); rim.position.set(-4, 1, -3); scene.add(rim);

  var grad = new THREE.DataTexture(new Uint8Array([140, 140, 140, 255, 205, 205, 205, 255, 255, 255, 255, 255]), 3, 1);
  grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
  function toon(c) { return new THREE.MeshToonMaterial({ color: c, gradientMap: grad }); }

  var rig = new THREE.Group(); scene.add(rig);

  // the tee: a t-shirt silhouette, extruded with soft (bevelled) edges
  var s = new THREE.Shape();
  s.moveTo(-0.34, 1.0);
  s.quadraticCurveTo(0, 0.74, 0.34, 1.0);       // neckline
  s.lineTo(0.78, 0.9);                          // right shoulder
  s.lineTo(1.28, 0.42);                         // sleeve top
  s.quadraticCurveTo(1.2, 0.22, 1.02, 0.16);    // sleeve hem
  s.lineTo(0.74, 0.42);                         // armpit
  s.lineTo(0.76, -1.0);                         // right side
  s.quadraticCurveTo(0, -1.08, -0.76, -1.0);    // hem
  s.lineTo(-0.74, 0.42);
  s.lineTo(-1.02, 0.16);
  s.quadraticCurveTo(-1.2, 0.22, -1.28, 0.42);
  s.lineTo(-0.78, 0.9);
  s.lineTo(-0.34, 1.0);
  var teeGeo = new THREE.ExtrudeGeometry(s, { depth: 0.22, bevelEnabled: true, bevelThickness: 0.08,
    bevelSize: 0.07, bevelSegments: 5, curveSegments: 28 });
  teeGeo.center();
  var tee = new THREE.Mesh(teeGeo, toon(0x39ff5a)); rig.add(tee);
  tee.position.y = -0.05;

  // pink rib collar + a gold "smartfit tag" on the chest, on both sides
  var collar = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.06, 10, 40, Math.PI), toon(0x252b26));
  collar.rotation.z = Math.PI; collar.scale.set(1, 0.72, 1); collar.position.set(0, 0.88, 0); rig.add(collar);
  [1, -1].forEach(function (side) {
    var band = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 0.02), toon(0x252b26));
    band.position.set(0, 0.12, side * 0.2); rig.add(band);
    var tag = new THREE.Mesh(new THREE.CircleGeometry(0.15, 28), toon(0xf6c945));
    tag.position.set(side * -0.34, 0.42, side * 0.205); if (side < 0) tag.rotation.y = Math.PI; rig.add(tag);
  });

  // hanger: hook + shoulder bar
  var hanger = new THREE.Group(); hanger.position.y = 1.0; rig.add(hanger);
  var metal = toon(0xf0b93a);
  var hook = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.035, 10, 32, Math.PI * 1.4), metal);
  hook.position.set(0, 0.42, 0); hook.rotation.z = -0.3; hanger.add(hook);
  var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.22, 10), metal);
  neck.position.y = 0.2; hanger.add(neck);
  [-1, 1].forEach(function (side) {
    var arm = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.98, 10), metal);
    arm.rotation.z = side * 1.12; arm.position.set(side * 0.44, -0.05, 0); hanger.add(arm);
  });

  // spin + a little swing, looping exactly over `frames`
  var t = frame / frames;
  rig.rotation.y = t * Math.PI * 2;
  rig.rotation.z = Math.sin(t * Math.PI * 4) * 0.06;
  rig.rotation.x = 0.14;
  renderer.render(scene, camera);
  var img = new Image(); img.src = renderer.domElement.toDataURL("image/png");
  img.style.cssText = "width:100%;height:100%;display:block";
  renderer.domElement.style.display = "none"; document.body.appendChild(img);
})();
</script>
</body>
</html>
