<!DOCTYPE html>

<html class="light" lang="en"><head>

<title>SmartFit - Join the Future of Fashion</title>

                    "spacing": {

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface/80 shadow-[0px_40px_40px_rgba(0,0,0,0.05)] flex items-center justify-between px-container-margin-mobile h-16">
<div class="flex items-center gap-4">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<h1 class="font-headline-lg text-headline-lg tracking-tight text-primary">SmartFit</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow pt-24 pb-12 px-container-margin-mobile max-w-xl mx-auto w-full">
<!-- Hero Section -->
<section class="text-center mb-stack-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-2">Create Your Style</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join our community and discover your perfect look with AI-powered fittings.</p>
</section>
<!-- Profile Photo Upload -->
<section class="flex flex-col items-center mb-stack-lg">
<div class="relative group cursor-pointer">
<div class="w-28 h-28 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border-2 border-primary-container/20 group-hover:border-primary transition-colors">
<img class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" data-alt="A professional studio portrait of a stylish young person with a neutral expression, captured with high-key lighting and a soft lavender-tinted background. The aesthetic is clean and editorial, featuring a minimalist atmosphere that highlights the natural features of the subject. The lighting is diffused and bright, creating a luminous and optimistic mood suitable for a premium fashion application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqp-FhfxDlikLEMFJ2ZrfNTcJqDs69MDXUc26fFEG4T3KID0c15qNsW6MS_DGT7JDN0m65yy0eWHt1AZIZFpM89WzEq6ouilpOJO1gemTpCqJc3L8hukcTTx_zEDwBvAq184UI5mbwqDue4SqyoXXnfCszEjTk62j8iDHpB-9amBSFVaKDB12L5KZRF21xZksXx0zmQiRnj3xG3WajQuSH8nfsO-joB4EksPgl0xoxzMocZLd64AbuBpZTaMiQzzQrQ19af3Zofpc"/>
<div class="absolute inset-0 flex items-center justify-center bg-black/10 group-hover:bg-transparent transition-colors">
<span class="material-symbols-outlined text-white" data-icon="add_a_photo">add_a_photo</span>
</div>
</div>
</div>
<span class="mt-stack-sm font-label-md text-label-md text-primary">Add profile photo</span>
</section>
<!-- Registration Form -->
<form class="space-y-stack-md">
<!-- Input Fields -->
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-12 pr-4 py-4 rounded-lg bg-white border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md transition-all shadow-sm" id="username" placeholder="Choose a unique name" type="text"/>
</div>
</div>
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-12 pr-4 py-4 rounded-lg bg-white border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md transition-all shadow-sm" id="email" placeholder="hello@example.com" type="email"/>
</div>
</div>
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-12 py-4 rounded-lg bg-white border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none font-body-md text-body-md transition-all shadow-sm" id="password" placeholder="Min. 8 characters" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Style Preference Selection -->
<div class="pt-stack-md">
<label class="font-label-md text-label-md text-on-surface-variant px-1 mb-stack-sm block">Pick your vibe</label>
<div class="grid grid-cols-3 gap-3">
<button class="flex flex-col items-center justify-center p-4 rounded-lg bg-white border border-outline-variant hover:border-primary hover:bg-primary/5 transition-all group active:scale-95" type="button">
<span class="material-symbols-outlined text-outline group-hover:text-primary mb-2" data-icon="apparel">apparel</span>
<span class="font-label-md text-label-md">Streetwear</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-lg bg-secondary-container text-on-secondary-container border border-secondary transition-all active:scale-95" type="button">
<span class="material-symbols-outlined mb-2" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md">Clean</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-lg bg-white border border-outline-variant hover:border-primary hover:bg-primary/5 transition-all group active:scale-95" type="button">
<span class="material-symbols-outlined text-outline group-hover:text-primary mb-2" data-icon="diamond">diamond</span>
<span class="font-label-md text-label-md">Luxury</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-stack-lg">
<button class="w-full py-4 rounded-lg bg-primary text-white font-button-label text-button-label shadow-[0px_10px_20px_rgba(107,56,212,0.2)] hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
                    Sign Up
                </button>
</div>
</form>
<!-- Footer Links -->
<footer class="mt-stack-lg text-center space-y-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                Already have an account? <a class="text-primary font-semibold hover:underline" href="#">Log In</a>
</p>
<div class="flex justify-center gap-6 text-outline text-label-md font-label-md">
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
</div>
</footer>
</main>
<!-- Background Decorative Elements (Luminous Editorial) -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary-fixed-dim/20 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[5%] -right-[10%] w-[50%] h-[50%] bg-secondary-fixed/20 blur-[120px] rounded-full"></div>
</div>
</body></html>
