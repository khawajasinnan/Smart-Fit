<body class="font-body-md text-body-md selection:bg-primary-fixed">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-xl bg-surface/80 shadow-[0px_40px_40px_rgba(0,0,0,0.05)] flex items-center justify-between px-container-margin-mobile h-16">
<button class="active:scale-95 transition-transform hover:opacity-80 transition-opacity flex items-center justify-center p-2">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg text-headline-lg tracking-tight text-primary">SmartFit</h1>
<button class="active:scale-95 transition-transform hover:opacity-80 transition-opacity flex items-center justify-center p-2">
<span class="material-symbols-outlined text-primary" data-icon="settings">settings</span>
</button>
</header>
<main class="pt-24 pb-12 px-container-margin-mobile max-w-xl mx-auto min-h-screen flex flex-col">
<!-- Header Section -->
<section class="mb-stack-lg">
<h2 class="font-display-lg text-display-lg text-on-background mb-unit">About You</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Help us find your perfect fit with a few simple details.</p>
</section>
<!-- Body Type Selection -->
<section class="mb-stack-lg">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest block mb-stack-sm">Body Type</label>
<div class="grid grid-cols-3 gap-unit">
<!-- Slim Option -->
<button class="group flex flex-col items-center gap-stack-sm p-4 bg-surface-container-lowest border-2 border-transparent hover:border-primary-container rounded-lg transition-all active:scale-95 shadow-sm">

</div>
<span class="font-label-md text-label-md text-on-surface group-hover:text-primary">Slim</span>
</button>
<!-- Athletic Option (Active State Example) -->
<button class="group flex flex-col items-center gap-stack-sm p-4 bg-primary-fixed border-2 border-primary rounded-lg transition-all active:scale-95 shadow-sm">
<div class="w-20 h-28 bg-surface-container-high rounded-lg overflow-hidden mb-2">
<img class="w-full h-full object-cover" data-alt="A high-fidelity 3D character design showcasing an athletic physique with defined proportions. The character stands in a confident pose against a bright, airy digital studio environment. The color palette features luminous lavenders and crisp whites, reflecting a premium Gen-Z fashion interface aesthetic. The image is rendered with smooth textures and ambient occlusion shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCn2QcapMoYxXoarSheGKRtK0p695dFAFsbARKeTX1AIBfYeQZA_6JS6Dih2DW0dtuWmbxH2ORzWmmirqNPhwQeYv8Ly8JjEgkeY4suebKKxFx6nJmR2cbv2sn1hUbxL8RR8_gMLIEMg3eEMC_hc3pIImkrmdnaHitCsJN8lHklSdj1EttEzCgfrzcsBe_lFW9qfn5RExb4TDX99Fyi2a9nIyBbkjqfhl83zrOnDDSoOUTW45X0ux8gEWEHbVLNqEfITO9iIvfyVXM"/>
</div>
<span class="font-label-md text-label-md text-primary font-bold">Athletic</span>
</button>
<!-- Broad Option -->
<button class="group flex flex-col items-center gap-stack-sm p-4 bg-surface-container-lowest border-2 border-transparent hover:border-primary-container rounded-lg transition-all active:scale-95 shadow-sm">
<div class="w-20 h-28 bg-surface-container-high rounded-lg overflow-hidden mb-2">

</div>
<span class="font-label-md text-label-md text-on-surface group-hover:text-primary">Broad</span>
</button>
</div>
</section>
<!-- Sliders Section -->
<div class="space-y-stack-lg mb-stack-lg">
<!-- Height Slider -->
<div class="p-stack-md bg-surface-container-low rounded-lg shadow-sm border border-outline-variant/30">
<div class="flex justify-between items-center mb-stack-md">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Height</label>
<span class="font-headline-md text-headline-md text-primary">182 <span class="text-label-md font-normal text-on-surface-variant">cm</span></span>
</div>
<input class="w-full accent-primary" max="220" min="140" type="range" value="182"/>
<div class="flex justify-between mt-stack-sm text-label-md text-outline">
<span>140cm</span>
<span>220cm</span>
</div>
</div>
<!-- Weight Slider -->
<div class="p-stack-md bg-surface-container-low rounded-lg shadow-sm border border-outline-variant/30">
<div class="flex justify-between items-center mb-stack-md">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Weight</label>
<span class="font-headline-md text-headline-md text-primary">78 <span class="text-label-md font-normal text-on-surface-variant">kg</span></span>
</div>
<input class="w-full accent-primary" max="150" min="40" type="range" value="78"/>
<div class="flex justify-between mt-stack-sm text-label-md text-outline">
<span>40kg</span>
<span>150kg</span>
</div>
</div>
</div>
<!-- Action Button -->
<div class="mt-auto pt-stack-lg">
<button class="w-full bg-[#F472B6] text-white font-button-label text-button-label py-5 rounded-lg shadow-[0px_10px_30px_rgba(244,114,182,0.3)] hover:opacity-90 active:scale-[0.98] transition-all">
                Finish Setup
            </button>
<p class="text-center mt-stack-md font-label-md text-outline">You can always update these later in settings.</p>
</div>
