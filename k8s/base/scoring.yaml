# Look score, styling hints and feedback learning (SFR-032..034)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring
  labels:
    app.kubernetes.io/name: scoring
    app.kubernetes.io/part-of: smartfit
spec:
  replicas: 1
  # one writer for the model volume (spec §23.26): stop the old pod first
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scoring
        app.kubernetes.io/part-of: smartfit
    spec:
      initContainers:
        # first boot / feature-list change: copy the image's models onto the volume;
        # otherwise keep the models learned from users
        - name: seed-models
          image: smartfit/scoring
          command: ["python", "-m", "shared.seed_models", "/app/services/scoring/models", "/models", "look_card.json"]
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: scoring
          image: smartfit/scoring
          ports:
            - name: http
              containerPort: 8007
          envFrom:
            - configMapRef:
                name: smartfit-config
            - secretRef:
                name: smartfit-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi  # includes the scheduled retraining process
          volumeMounts:
            - name: models
              mountPath: /app/services/scoring/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: scoring-models
---
apiVersion: v1
kind: Service
metadata:
  name: scoring
  labels:
    app.kubernetes.io/name: scoring
    app.kubernetes.io/part-of: smartfit
spec:
  selector:
    app.kubernetes.io/name: scoring
  ports:
    - name: http
      port: 8007
      targetPort: http
