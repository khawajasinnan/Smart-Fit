# Hairstyle scaffold (SFR-029..031)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hairstyle
  labels:
    app.kubernetes.io/name: hairstyle
    app.kubernetes.io/part-of: smartfit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hairstyle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hairstyle
        app.kubernetes.io/part-of: smartfit
    spec:
      containers:
        - name: hairstyle
          image: smartfit/hairstyle
          ports:
            - name: http
              containerPort: 8006
          envFrom:
            - configMapRef:
                name: smartfit-config
            - secretRef:
                name: smartfit-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hairstyle
  labels:
    app.kubernetes.io/name: hairstyle
    app.kubernetes.io/part-of: smartfit
spec:
  selector:
    app.kubernetes.io/name: hairstyle
  ports:
    - name: http
      port: 8006
      targetPort: http
