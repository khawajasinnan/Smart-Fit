    body {

<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-x-hidden selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<!-- Ambient Gradients (Luminous Aesthetic) -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-secondary-fixed-dim/30 rounded-full mix-blend-multiply filter blur-[100px]"></div>
<div class="absolute top-1/3 -right-20 w-[500px] h-[500px] bg-primary-fixed-dim/20 rounded-full mix-blend-multiply filter blur-[100px]"></div>
<div class="absolute -bottom-40 left-1/4 w-[700px] h-[700px] bg-secondary-fixed-dim/20 rounded-full mix-blend-multiply filter blur-[120px]"></div>
</div>
<!-- Top Navigation (Suppressed per logic, only back button for transactional flow) -->
<header class="w-full flex items-center justify-between px-margin-mobile py-6 z-50">
<a class="w-12 h-12 flex items-center justify-center rounded-full bg-surface/70 backdrop-blur-md border border-white/40 shadow-[0_4px_20px_rgba(139,92,246,0.05)] hover:bg-surface-container-high transition-colors" href="#">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</a>
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile py-8 md:py-16">
<div class="w-full max-w-md w-full relative">
<!-- Glass Card Container -->
<div class="relative z-10 bg-surface/70 backdrop-blur-[30px] border border-white/60 rounded-[32px] p-8 md:p-10 shadow-[0_20px_60px_rgba(180,19,109,0.1)]">
<div class="text-center mb-10">
<h1 class="font-display-lg text-display-lg text-on-background mb-3">Join SmartFit</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Create your account to start curating vibes.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Name Input -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-2" for="name">Name</label>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-background border border-outline-variant/30 rounded-[24px] px-6 py-4 font-body-lg text-body-lg placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-all shadow-inner" id="name" name="name" placeholder="Alex Rivera" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-2" for="email">Email</label>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-background border border-outline-variant/30 rounded-[24px] px-6 py-4 font-body-lg text-body-lg placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-all shadow-inner" id="email" name="email" placeholder="hello@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant ml-2" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low text-on-background border border-outline-variant/30 rounded-[24px] px-6 py-4 font-body-lg text-body-lg placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-secondary-container transition-all shadow-inner" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Join Button -->
<button class="w-full bg-secondary-container text-on-secondary-container font-headline-md text-headline-md py-4 rounded-full mt-8 shadow-[0_10px_30px_rgba(253,86,167,0.3)] hover:shadow-[0_15px_40px_rgba(253,86,167,0.4)] hover:bg-secondary transition-all hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2" type="submit">
                        Join
                        <span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Already have an account? 
                        <a class="text-secondary-container font-bold hover:text-secondary transition-colors underline decoration-2 underline-offset-4 decoration-secondary-fixed" href="#">Log In</a>
</p>
</div>
</div>
<!-- Decorative Behind-Card Element -->
<div class="absolute -z-10 -bottom-6 -right-6 w-32 h-32 bg-primary-container rounded-full mix-blend-multiply filter blur-[40px] opacity-60"></div>
</div>
</main>
</body></html>
