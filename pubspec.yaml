name: smartfit
description: "SmartFit — AI-driven virtual try-on & outfit recommendation app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Auth
  supabase_flutter: ^2.0.0
  google_sign_in: ^6.1.5

  # State management
  flutter_riverpod: ^2.4.0

  # Routing
  go_router: ^14.0.0

  # Networking
  http: ^1.2.0

  # UI
  image_picker: ^1.0.4

  # Local storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0

  # Utils
  intl: ^0.18.0
  uuid: ^4.2.1
  speech_to_text: ^7.0.0

  camera: ^0.12.0+1
  google_mlkit_pose_detection: ^0.12.0
  flutter_animate: ^4.5.2
  url_launcher: ^6.2.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
