# Tooling config for the SmartFit backend (not a packaging file).
# Run everything from backend/:   pytest   |   ruff check .

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
# Real errors only for now (undefined names, unused imports, syntax errors);
# style rules can be tightened once the codebase is cleaned up.
select = ["F", "E9"]
